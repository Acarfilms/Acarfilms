    <stop offset="0" stop-color="#0A84FF"/><stop offset="0.25" stop-color="#5E5CE6"/><stop offset="0.5" stop-color="#BF5AF2"/><stop offset="0.75" stop-color="#FF375F"/><stop offset="1" stop-color="#FF9F0A"/>
